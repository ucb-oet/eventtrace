[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eventtrace"
version = "0.1.0"
description = "Native producers for the EventTrace protobuf stream"
readme = "README.md"
requires-python = ">=3.11"

[project.urls]
Repository = "https://github.com/ucb-oet/eventtrace"
Documentation = "https://github.com/ucb-oet/eventtrace#native-python-producers"

[tool.setuptools.packages.find]
include = ["eventtrace*"]
