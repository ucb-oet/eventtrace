[package]
name = "eventtrace"
version = "0.1.0"
edition = "2024"
description = "Reads EventTrace traces, and the tools built on reading them"
publish = false

[dependencies]
capstone = { version = "0.14", default-features = false, features = ["full", "std", "arch_riscv"] }
clap = { version = "4.6", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[build-dependencies]
prost-build = "0.14"
protox = "0.10"

# Sodor's checker, which may not stay; src/main.rs is the `eventtrace` command.
[[bin]]
name = "check_sodor"
path = "sodor/check.rs"
