[project]
name = "eventtrace-scripts"
version = "0.1.0"
description = "Tools that read EventTrace traces: a text dump, the Sodor checker, and the Perfetto converter."
requires-python = ">=3.10"
dependencies = [
    "capstone>=5.0.9",
    "grpcio-tools>=1.84.0",
    "perfetto>=0.58.2",
    "protobuf>=7.36.2",
]
